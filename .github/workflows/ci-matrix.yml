name: CI Matrix

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.os }} ghc-${{ matrix.ghc }} dismantle-${{ matrix.pkg }}
    strategy:
      matrix:
        cabal: ['3.14.2.0']
        ghc: ['9.8.4', '9.10.1', '9.12.2']
        os: [ubuntu-latest, macOS-latest, windows-latest]
        pkg: ['tablegen', 'arm', 'thumb', 'ppc', 'aarch64', 'arm-xml']
        exclude:
          # Only test macOS and Windows on the latest supported GHC versions
          - os: macOS-latest
            ghc: 9.8.4
          - os: macOS-latest
            ghc: 9.10.1
          - os: windows-latest
            ghc: 9.8.4
          - os: windows-latest
            ghc: 9.10.1
          # This configuration runs out of memory
          - os: windows-latest
            pkg: aarch64
    uses: GaloisInc/.github/.github/workflows/haskell-ci.yml@v1
    with:
      build-targets: dismantle-${{ matrix.pkg }}
      check: false
      # See Note [Parallelism] in `haskell-ci.yml` for why `--ghc-options='-j'`
      # and `--semaphore`.
      #
      # For `--allow-newer`, see
      # https://github.com/hedgehogqa/haskell-hedgehog-classes/issues/63
      configure-flags: --enable-tests --ghc-options='-Werror=compat -Werror=default -j' --semaphore --allow-newer=hedgehog-classes:base
      ghc: ${{ matrix.ghc }}
      os: ${{ matrix.os }}
      pre-hook: |
        cp cabal.project.newbuild cabal.project
      sdist-targets: dismantle-${{ matrix.pkg }}
      submodules: "true"
      test-targets: dismantle-${{ matrix.pkg }}
      test: ${{ startsWith(matrix.os, 'ubuntu') }}
